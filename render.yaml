# Render Blueprint — one web service serves the API, the WebSocket server and the React build.
# Render → New → Blueprint → select this repo. Then set MONGODB_URI (MongoDB Atlas) in the dashboard.
services:
  - type: web
    name: youtube-watch-party
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false # secret — enter it in the Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret for signing login tokens
